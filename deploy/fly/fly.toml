app = "aidmin-orchestrator"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "n8n_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"

# n8n (editor + webhooks) - publico, el dueno de la pyme (admin de AIdmin) entra a
# loguearse aca.
[[services]]
  internal_port = 5678
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.ports]]
    port = 80
    handlers = ["http"]

# approval-gate - lo llama el panel web (Vercel) cuando el cliente aprueba/rechaza
# una orden de pago.
[[services]]
  internal_port = 4000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 4000
    handlers = ["tls", "http"]

# content-gate - lo llama el panel web (Vercel) cuando el cliente aprueba/rechaza
# una publicacion.
[[services]]
  internal_port = 4001
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 4001
    handlers = ["tls", "http"]
